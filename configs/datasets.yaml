# Stage 1 download targets — Tier 1 primary sources only (true PAN band).
# See docs/plan §2 for the full sourcing rationale and tier breakdown.
#
# This is the COMPLETE required source list for the real run: the download
# scripts (and run_pipeline.py) pull every scene under these AOIs/events with
# no cap. `--list-only` previews the total size first. To scale the dataset up
# or down, add/remove AOIs (spacenet.aois) and events (maxar.events) here.
# The `--max-files` CLI flag exists only for laptop smoke tests.
#
# ---------------------------------------------------------------------------
# SOURCES THAT COVER THE SAME GROUND  (read before changing the split)
# ---------------------------------------------------------------------------
# Several sources here image the same ground under different scene names. That
# is deliberate and useful — but it means a split keyed on scene name puts the
# same ground in train and test, which inflates test PSNR/SSIM because the
# model has already seen those pixels. Measured on a reproduction of these four
# routes: a scene-name split leaked 33% of both val and test, with a nearest
# train-patch distance of 0 m.
#
#   1. core3d: ~154 scenes over 5 sites, i.e. tens of repeat WorldView collects
#      of the same city on different dates.
#   2. maxar events: pre-event and post-event acquisitions of the same quadkeys.
#   3. maxar_visual: the SAME scenes as `maxar`, just the `visual` asset instead
#      of `pan_analytic` (see its note below).
#   4. naip_pc: its AOIs are chosen to overlap the CORE3D sites on purpose, so
#      Experiment 2's pseudo-PAN covers Experiment 1's true-PAN ground.
#   5. spacenet: strips within one AOI overlap at the edges.
#
# Two consequences for the workflow:
#   - stage 6b splits by GEOGRAPHIC BLOCK (configs/split.yaml), not scene name,
#     so repeat coverage of one location always lands in one split. Verify with
#     data_pipeline/06_package/audit_split_leakage.py, which fails on any
#     held-out patch that overlaps training ground.
#   - build and split ONE manifest containing every source. If true-PAN and
#     pseudo-PAN are split separately, the block assignment is independent and
#     the leakage comes straight back. Experiment 1 vs 2 is selected at
#     training time with `data.pan_filter`, never by splitting twice.

spacenet:
  bucket: spacenet-dataset          # public, anonymous/unsigned S3 access
                                     # (verified 2026-07-11: no AWS credentials
                                     # or RequestPayer header required)
  band: PAN                         # true panchromatic GeoTIFFs
  # AOIs chosen for terrain/geographic diversity within SpaceNet's urban focus
  aois:
    - AOI_2_Vegas          # dense low-rise urban grid
    - AOI_3_Paris          # dense historic urban
    - AOI_4_Shanghai       # dense high-rise urban
    - AOI_5_Khartoum       # arid/urban-fringe, bare-land-adjacent
    - AOI_7_Moscow         # urban + surrounding green space
    - AOI_8_Mumbai         # dense coastal urban
  # Skip whole-AOI mosaics: they are built from the same strips (measured 100%
  # footprint overlap for Vegas), so keeping both would put identical ground
  # into two "scenes" and leak across the scene-level train/test split.
  exclude_patterns: ["*_PAN_COG.tif"]
  out_dir: data/raw/spacenet

maxar:
  bucket: maxar-opendata            # public, anonymous S3/HTTPS access
  catalog_url: https://maxar-opendata.s3.amazonaws.com/events/catalog.json
  asset: pan_analytic               # true panchromatic COG (verified structure:
                                     # events/<event>/ard/acquisition_collections/
                                     # <id>_collection.json -> ../<utm>/<quadkey>/<date>/<id>.json
                                     # -> assets.pan_analytic.href = <id>-pan.tif)
  # events picked to cover terrain classes SpaceNet's urban focus can't reach:
  # coastal/flood (water), disaster-affected mountainous regions, etc.
  events:
    - Brazil-Flooding-May24     # water / flood terrain
    - Belize-Wildfires-June24   # forest / burn scar terrain
  out_dir: data/raw/maxar

# ---------------------------------------------------------------------------
# TRUE PAN (Experiment 1) — third source, added 2026-07-28
# ---------------------------------------------------------------------------
core3d:
  # IARPA CORE3D public data, hosted by SpaceNet in the SAME public bucket we
  # already use, so no new credentials. Verified live 2026-07-28:
  #   154 true-PAN GeoTIFFs, ~311 GB, WorldView-2 + WorldView-3,
  #   measured GSD 0.34-0.46 m, single-band uint16, tiled with overviews.
  # The real imagery is the `-P1BS-*_lv1.tif` files; the same-named plain
  # `.tif` are 0-byte VRT sidecars, so the downloader matches BOTH patterns.
  bucket: spacenet-dataset
  prefix: "Hosted-Datasets/CORE3D-Public-Data/Satellite-Images/"
  min_scene_bytes: 10000000       # skips the 0-byte sidecars and stubs
  # sites add terrain SpaceNet lacks: Omaha = Midwest agriculture,
  # Jacksonville/Tampa = coastal + water, UCSD = arid/chaparral coastal,
  # Richmond = urban + forest.
  sites: [Jacksonville, Omaha, Richmond, Tampa, UCSD]
  out_dir: data/raw/core3d

# ---------------------------------------------------------------------------
# PSEUDO-PAN (Experiment 2 only) — RGB sources, converted to grayscale by
# stage 2's rgb_to_pseudo_pan mode and tagged pseudo_pan=true. These must
# never enter the Experiment 1 training set.
# ---------------------------------------------------------------------------
maxar_visual:
  # Same STAC catalog and downloader as `maxar` above, just the 3-band `visual`
  # asset instead of `pan_analytic`. Cheapest possible pseudo-PAN source: same
  # scenes, same resolution, same licence — so a PAN-vs-pseudo-PAN comparison
  # is not confounded by a change of sensor or geography.
  #
  # BY CONSTRUCTION THIS IS THE SAME GROUND AS `maxar`. Every patch here has a
  # true-PAN twin covering identical pixels under a different scene name. The
  # geographic-block split keeps both in the same split; a scene-name split
  # would have put the PAN version in train and the visual version in test.
  # It also means Experiment 2 is not "more data" in the sense of more ground —
  # it is the same ground imaged a second way, which is what the experiment is
  # for, and should be described that way in the write-up rather than as a
  # dataset-size increase.
  same_ground_as: maxar
  # Run:  python data_pipeline/01_download/download_maxar.py \
  #           --asset visual --out-dir data/raw_rgb/maxar_visual
  asset: visual
  out_dir: data/raw_rgb/maxar_visual

naip_pc:
  # USDA NAIP via Microsoft Planetary Computer. The naip-* S3 buckets refuse
  # anonymous access (verified: AccessDenied), but the PC STAC API searches
  # anonymously and its free /api/sas/v1/sign endpoint needs no account —
  # so this route is fully scriptable. Newer NAIP is 0.3 m, delivered as COGs.
  collection: naip
  max_gsd: 0.6                    # accept 30-60 cm; reject coarser
  windows_per_scene: 30           # scenes are ~2 GB -> extract crops instead
  window_size: 1024
  out_dir: data/raw_rgb/naip
  aois:
    - name: omaha_agriculture     # pairs with CORE3D Omaha
      bbox: [-96.20, 41.20, -96.00, 41.40]
      datetime: "2021-01-01/2024-12-31"
      limit: 4
    - name: iowa_cropland
      bbox: [-93.80, 41.50, -93.60, 41.70]
      datetime: "2021-01-01/2024-12-31"
      limit: 4
    - name: florida_coastal      # pairs with CORE3D Jacksonville/Tampa
      bbox: [-81.75, 30.25, -81.55, 30.45]
      datetime: "2021-01-01/2024-12-31"
      limit: 4
