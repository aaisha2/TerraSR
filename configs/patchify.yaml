# Stage 3 patch extraction + filtering thresholds — see docs/plan §3, §7.

patch_size: 256        # HR patch, pixels (matches §3 sizing recommendation)
stride: 256             # no overlap by default — set < patch_size to overlap
drop_partial_edge: true  # skip incomplete grid cells at scene edges rather than pad
inline_filter: true      # drop mostly-nodata / blank patches BEFORE writing them
                         # (same nodata + std thresholds as `filter` below; the
                         # saturation check still runs in patch_filter.py).
                         # Avoids writing thousands of scene-collar patches that
                         # would only be deleted later.

filter:
  max_nodata_fraction: 0.05     # drop patch if > 5% pixels == nodata sentinel (0)
  min_std_dev: 4.0               # drop near-constant/blank patches (uint16 DN units)
  max_saturated_fraction: 0.15   # crude cloud/glare proxy: fraction of pixels
                                  # above saturated_percentile of the *scene's*
                                  # observed max, not a fixed absolute value
  saturated_percentile: 99.0
